<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4ece3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="A little birthday website for Ashwaki." />
    <title>for Ashwaki ♥</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♥</text></svg>" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg class="clip-svg" aria-hidden="true" focusable="false">
      <defs>
        <clipPath id="heartCut" clipPathUnits="objectBoundingBox">
          <path d="M0.5,0.9 C0.2,0.64 0,0.4 0,0.24 C0,0.1 0.12,0 0.26,0 C0.36,0 0.45,0.05 0.5,0.16 C0.55,0.05 0.64,0 0.74,0 C0.88,0 1,0.1 1,0.24 C1,0.4 0.8,0.64 0.5,0.9 Z" />
        </clipPath>
      </defs>
    </svg>

    <div class="grain" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>
    <div class="floaters" id="floaters" aria-hidden="true"></div>
    <div class="heart-scatter" id="heartScatter" aria-hidden="true"></div>

    <main class="stage" id="stage">
      <section class="scene is-on" data-scene="intro" aria-label="Welcome">
        <p class="kicker">♥ a little something ♥</p>
        <p class="whisper" id="introText">hey Ashwaki.</p>
        <p class="heart-row" aria-hidden="true">♥ ♡ ♥ ♡ ♥</p>
        <button class="text-btn" id="introBtn" type="button">continue</button>
      </section>

      <section class="scene" data-scene="envelope" aria-label="Envelope">
        <p class="whisper small">open me ♥</p>
        <button class="envelope" id="envelope" type="button" aria-label="Open the letter">
          <span class="envelope-shadow"></span>
          <span class="letter-peek">
            <span class="peek-lines"></span>
          </span>
          <span class="pocket"></span>
          <span class="flap"></span>
          <span class="seal" aria-hidden="true">♥</span>
        </button>
        <p class="hint" id="envelopeHint">tap the heart</p>
      </section>

      <section class="scene" data-scene="letter" aria-label="Birthday letter">
        <article class="paper" id="paper">
          <p class="paper-hearts" aria-hidden="true">♥ ♡ ♥</p>
          <p class="paper-date" id="letterDate"></p>
          <p class="paper-body" id="letterBody"></p>
        </article>
        <button class="text-btn is-hidden" id="letterBtn" type="button">keep going</button>
      </section>

      <section class="scene" data-scene="photo" aria-label="A little photo">
        <p class="kicker">♥ little you ♥</p>
        <p class="whisper small">look at you.</p>
        <figure class="cutout" id="cutout">
          <span class="tape" aria-hidden="true"></span>
          <div class="cutout-paper"></div>
          <div class="cutout-window">
            <img
              id="cutoutPhoto"
              alt="Ashwaki"
            />
          </div>
          <figcaption class="cutout-caption">little Ashwaki</figcaption>
        </figure>
        <button class="text-btn" id="photoBtn" type="button">keep going</button>
      </section>

      <section class="scene" data-scene="reasons" aria-label="Reasons I love you">
        <p class="kicker">♥ just a few ♥</p>
        <h2 class="scene-title">reasons I love you</h2>
        <p class="heart-row tiny" aria-hidden="true">♡ ♥ ♡</p>
        <div class="cards" id="cards"></div>
        <button class="text-btn" id="reasonsBtn" type="button">one more thing</button>
      </section>

      <section class="scene" data-scene="cake" aria-label="Birthday cake">
        <p class="whisper small" id="cakePrompt">make a wish</p>
        <div class="cake-scene" id="cake">
          <div class="cake">
            <div class="candles">
              <span class="candle"><i class="flame"></i></span>
              <span class="candle tall"><i class="flame"></i></span>
              <span class="candle"><i class="flame"></i></span>
            </div>
            <div class="icing"><span class="cake-heart">♥</span></div>
            <div class="layer top"></div>
            <div class="layer mid"></div>
            <div class="layer base"></div>
            <div class="plate"></div>
          </div>
        </div>
        <div class="actions">
          <button class="pill-btn" id="blowBtn" type="button">blow out the candles</button>
          <button class="text-btn is-hidden" id="cakeBtn" type="button">okay… now this</button>
        </div>
      </section>

      <section class="scene" data-scene="finale" aria-label="Happy birthday">
        <p class="kicker" id="finaleKicker">september 6th</p>
        <h1 class="script" id="finaleTitle">happy birthday</h1>
        <p class="beloved" id="finaleName"></p>
        <p class="heart-row finale-hearts" aria-hidden="true">♥ ♡ ♥ ♡ ♥ ♡ ♥</p>
        <p class="closing" id="finaleLove">I love you. ♥</p>
        <p class="from" id="finaleFrom"></p>
      </section>
    </main>

    <canvas id="confetti" aria-hidden="true"></canvas>
    <script src="./app.js"></script>
  </body>
</html>
